name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate package
        run: npm run check
      - name: Build store zip
        run: npm run package
      - name: Verify zip integrity
        run: python3 -m zipfile -t dist/google-photos-remover-*.zip
